# pnpm-innstillinger.
#
# De lå i "pnpm"-feltet i package.json, men pnpm 10 leser dem ikke lenger
# derfra — den skriver bare en advarsel og går videre. Overstyringene under har
# altså vært uten virkning en stund. Se https://pnpm.io/settings

overrides:
    # Låst av Next.js sitt eget React-oppsett. Uten disse trekker
    # avhengighetene inn flere @types/react-versjoner, og typene kolliderer.
    '@types/react': 19.1.13
    '@types/react-dom': 19.1.9

    # Sikkerhetsfikser i transitive pakker. Ingen av dem er noe vi ber om
    # selv — de kommer via andre pakker, som kapper dem på en sårbar versjon.
    # Dependabot kan ikke løse dem alene (den melder
    # `security_update_not_possible` fordi den bare oppdaterer direkte
    # avhengigheter), så de må tvinges her.
    #
    # Når foreldrepakkene selv rekker forbi disse versjonene, kan linjene
    # fjernes igjen.
    'js-yaml@4': ^4.3.1
    'fast-uri@3': ^3.1.5
    # Både 1.x og 2.x ligger i treet, og de er sårbare hver for seg. Én felles
    # overstyring ville tvunget alle ned på samme major og brukket den andre.
    'brace-expansion@1': ^1.1.18
    'brace-expansion@2': ^2.1.4
    'glob@10': ^10.5.0
    'lodash@4': ^4.18.0
    'minimatch@3': ^3.1.3
    'minimatch@9': ^9.0.7
    'nanoid@3': ^3.3.18
    'picomatch@2': ^2.3.2
    'picomatch@4': ^4.0.4
    'postcss@8': ^8.5.26
    'defu@6': ^6.1.5
    'effect@3': ^3.20.0
    'flatted@3': ^3.4.2
    'yaml@2': ^2.8.3
    'sharp@0': ^0.35.0
    # serialize-javascript og flatted er byggetidsavhengigheter (terser,
    # webpack). Majoren 6 -> 7 er derfor et byggeanliggende, ikke noe som
    # havner i det som sendes til nettleseren.
    'serialize-javascript@6': ^7.0.5

    # webpack står med to lav-alvorlighets varsler (dev), men lar seg ikke
    # overstyre: den er en auto-installert peer av mini-css-extract-plugin og
    # terser-webpack-plugin, og pnpm løser slike utenom overrides. Å tvinge
    # den inn som direkte avhengighet ville gitt Next en annen webpack enn den
    # forventer. Lav nok risiko til å la ligge.

# Pakker som får lov til å kjøre byggeskript ved installasjon. pnpm 10 blokkerer
# dem som standard.
onlyBuiltDependencies:
    - '@prisma/client'
    - '@prisma/engines'
    - prisma
    - sharp
